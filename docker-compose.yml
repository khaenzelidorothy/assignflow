
services:
  postgres:
    image: postgres:15-alpine
    container_name: assignflow_postgres
    environment:
      POSTGRES_DB: assignflow
      POSTGRES_USER: assignflow
      POSTGRES_PASSWORD: AssignFlow2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: assignflow_redis
    command: redis-server --appendonly yes --requirepass RedisPass2026!
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: assignflow_backend
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=super-secret-key-change-in-production-123456789
      - DB_NAME=assignflow
      - DB_USER=assignflow
      - DB_PASSWORD=AssignFlow2026!
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:RedisPass2026!@redis:6379/0
      - CELERY_BROKER_URL=redis://:RedisPass2026!@redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: assignflow_frontend
    working_dir: /app
    command: >
      sh -c "npm install &&
             npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  celery_worker:
    image: python:3.11-slim
    container_name: assignflow_celery
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A config worker -l INFO"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=super-secret-key-change-in-production-123456789
      - DB_NAME=assignflow
      - DB_USER=assignflow
      - DB_PASSWORD=AssignFlow2026!
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://:RedisPass2026!@redis:6379/0
      - CELERY_BROKER_URL=redis://:RedisPass2026!@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
